name: Endpoints helper

# Tests the endpoints helper against Prime Agent's latest release, then publishes
# the installer and the helper to GitHub Pages. The daily run catches a Prime Agent
# release that breaks the helper; GitHub only runs schedules on the default branch.

on:
  push:
    branches:
      - extensions
  pull_request:
    branches:
      - extensions
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Find Prime Agent's latest release
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.find.outputs.base_url }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - name: Read the release channel from Prime Agent's installer
        id: find
        run: |
          set -eu
          # The pattern matches the installer's literal DOWNLOAD_BASE_URL_DEFAULT line.
          base_url=$(curl -fsSL https://app.primeintellect.ai/prime-agent/install.sh |
            sed -n 's/^DOWNLOAD_BASE_URL_DEFAULT="\(.*\)"$/\1/p')
          version=$(curl -fsSL "$base_url/stable")
          version=${version#v}
          if [ -z "$base_url" ] || [ -z "$version" ]; then
            echo "::error::Could not read Prime Agent's release channel from its installer."
            exit 1
          fi
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Prime Agent $version from $base_url"

  test:
    name: Test on Prime Agent ${{ needs.release.outputs.version }}
    needs: release
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.release.outputs.base_url }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Lint the shell scripts
        run: shellcheck -x install.sh test/e2e-endpoints.sh test/e2e/lib.sh

      - name: Unit tests
        run: python3 -W error::ResourceWarning -m unittest discover -s test -v

      - name: Install Prime Agent
        id: agent
        run: |
          set -eu
          dir="$RUNNER_TEMP/prime-agent"
          archive="prime-agent-$VERSION-linux-x64.tar.gz"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSLO "$BASE_URL/releases/v$VERSION/$archive"
          curl -fsSL "$BASE_URL/releases/v$VERSION/SHA256SUMS" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive"
          echo "bin=$dir/prime-agent" >> "$GITHUB_OUTPUT"

      - name: End-to-end tests
        env:
          AGENT_BIN: ${{ steps.agent.outputs.bin }}
        run: test/e2e-endpoints.sh "$AGENT_BIN"

  installer:
    name: Test the installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install into a clean home from a local copy of the site
        run: |
          set -eu
          site="$RUNNER_TEMP/site"
          home="$RUNNER_TEMP/home"
          mkdir -p "$site/helper" "$home/.prime/agent/extensions" "$home/.prime/agent/endpoints"
          cp helper/prime-agent-endpoints "$site/helper/"
          (cd "$site/helper" && sha256sum prime-agent-endpoints > SHA256SUMS)
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$site" >/dev/null 2>&1 &
          sleep 1

          # What an earlier installer left: its two extensions, one of the user's own,
          # and an endpoint with its saved model list.
          printf '/**\n * OpenAI-compatible endpoints for Prime Agent.\n */\n' > "$home/.prime/agent/extensions/endpoints.ts"
          printf '/**\n * Chutes provider for Prime Agent.\n */\n' > "$home/.prime/agent/extensions/chutes.ts"
          printf '// mine\n' > "$home/.prime/agent/extensions/mine.ts"
          echo '{"endpoints":[{"id":"gpu","name":"GPU","baseUrl":"http://127.0.0.1:9/v1","enabled":true}]}' > "$home/.prime/agent/endpoints.json"
          echo '{"refreshedAt":1,"data":[{"id":"m1"},{"id":"m2"}]}' > "$home/.prime/agent/endpoints/gpu.models.json"

          env -i HOME="$home" PATH=/usr/bin:/bin TMPDIR="$RUNNER_TEMP" \
            PRIME_AGENT_ENDPOINTS_BASE_URL=http://127.0.0.1:8765 \
            PRIME_AGENT_INSTALLER_NONINTERACTIVE=1 PRIME_AGENT_BOOTSTRAP_KERNEL_ON_INSTALL=0 \
            PRIME_AGENT_INSTALLER_PLAIN=1 PRIME_AGENT_SHELL_PROFILE="$home/.profile" \
            sh install.sh </dev/null

          run() {
            env -i HOME="$home" PATH=/usr/bin:/bin TMPDIR="$RUNNER_TEMP" PI_SKIP_VERSION_CHECK=1 TERM=dumb "$@" </dev/null
          }
          run "$home/.local/bin/prime-agent" --version
          cmp helper/prime-agent-endpoints "$home/.prime/agent/helpers/prime-agent-endpoints"
          test ! -e "$home/.prime/agent/extensions/endpoints.ts"
          test ! -e "$home/.prime/agent/extensions/chutes.ts"
          test -e "$home/.prime/agent/extensions/mine.ts"
          run "$home/.local/bin/prime-agent-endpoints" list | grep -q 'GPU \[gpu\].* 2 models'
          # With no python3 on PATH the launcher uses uv, even when uv's cache cannot be written.
          env -i HOME="$home" PATH="$home/.local/bin" UV_CACHE_DIR=/proc/no-such-dir/uv \
            "$home/.local/bin/prime-agent-endpoints" list | grep -q 'GPU \[gpu\].* 2 models'
          run "$home/.local/bin/prime-agent" model list | grep -c '^gpu ' | grep -qx 2

  publish:
    name: Publish to GitHub Pages
    needs: [test, installer]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: Stage the installer, helper and landing page
        run: |
          set -eu
          cp install.sh site/install.sh
          # The former beta installer URL gets the same setup.
          cp install.sh site/install-beta.sh
          cp pages/index.md site/index.md
          mkdir -p site/helper
          cp helper/prime-agent-endpoints site/helper/
          (cd site/helper && sha256sum prime-agent-endpoints > SHA256SUMS)

      - name: Commit and push the site
        id: site
        working-directory: site
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh install-beta.sh index.md helper
          if git diff --cached --quiet; then
            echo "The site already serves this version."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "publish the endpoints helper from ${GITHUB_SHA::12}"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a Pages build
        if: steps.site.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with GITHUB_TOKEN do not start a Pages build on their own.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null

      - name: Wait for the site to serve this helper
        run: |
          set -eu
          owner=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          url="https://$owner.github.io/${GITHUB_REPOSITORY#*/}/helper/SHA256SUMS"
          expected=$(cd helper && sha256sum prime-agent-endpoints)
          for attempt in $(seq 60); do
            # A unique query string skips the CDN's cached copy.
            if [ "$(curl -fsSL "$url?check=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)" = "$expected" ]; then
              echo "Published: $url"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$url did not serve the new helper within 20 minutes."
          exit 1
